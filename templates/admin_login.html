<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PLCA Admin — Sign In</title>
    <style>
      :root {
        --accent: #0f6e56;
        --danger: #a32d2d;
        --border: rgba(0,0,0,0.10);
        --border-strong: rgba(0,0,0,0.18);
        --surface: #ffffff;
        --surface-2: #f9f9f8;
        --bg: #f0f0ee;
        --ink: #1a2820;
        --muted: #6b7280;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        color: var(--ink);
      }
      .login-wrap {
        width: min(380px, calc(100% - 32px));
      }
      .login-logo {
        width: 40px; height: 40px;
        border-radius: 10px;
        background: #1a2820;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
      }
      .login-logo-mark {
        width: 18px; height: 18px;
        border: 2px solid rgba(255,255,255,0.55);
        border-radius: 50% 0 50% 0;
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      }
      .login-title {
        font-size: 17px; font-weight: 600;
        color: var(--ink);
        margin-bottom: 3px;
      }
      .login-sub {
        font-size: 12px; color: var(--muted);
        margin-bottom: 24px;
      }
      .login-field { margin-bottom: 14px; }
      .login-label {
        display: block;
        font-size: 12px; font-weight: 600;
        color: var(--ink); margin-bottom: 5px;
      }
      .login-input {
        width: 100%;
        font: inherit; font-size: 13px;
        padding: 9px 11px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--ink);
        transition: border-color 0.12s, box-shadow 0.12s;
      }
      .login-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15,110,86,0.12);
      }
      .login-btn {
        width: 100%;
        font: inherit; font-size: 13px; font-weight: 600;
        padding: 10px;
        border: none;
        border-radius: 999px;
        background: #1a2820;
        color: #e8ede9;
        cursor: pointer;
        margin-top: 6px;
        transition: opacity 0.12s;
      }
      .login-btn:hover { opacity: 0.88; }
      .flash {
        font-size: 12px;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid rgba(163,45,45,0.3);
        background: rgba(163,45,45,0.06);
        color: #7a1a1c;
        margin-bottom: 16px;
      }
      .login-footer {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        margin-top: 18px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-logo"><div class="login-logo-mark"></div></div>
      <div class="login-card">
        <div class="login-title">HOA Admin Console</div>
        <div class="login-sub">Plantation Lakes Community Assoc.</div>

        {% with flashes = get_flashed_messages(with_categories=true) %}
          {% for category, message in flashes %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="post" action="{{ url_for('login_post') }}">
          <div class="login-field">
            <label class="login-label" for="username">Username</label>
            <input class="login-input" id="username" name="username"
                   type="text" autocomplete="username" required autofocus>
          </div>
          <div class="login-field">
            <label class="login-label" for="password">Password</label>
            <input class="login-input" id="password" name="password"
                   type="password" autocomplete="current-password" required>
          </div>
          <button class="login-btn" type="submit">Sign in</button>
        </form>
      </div>
      <div class="login-footer">Sessions expire after 8 hours &middot; PLCA internal use only</div>
    </div>
  </body>
</html>
