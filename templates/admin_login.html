<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOA Clause Admin — Sign In</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffaf1;
        --panel-2: #f1e6d2;
        --ink: #1f2a2f;
        --muted: #58656d;
        --accent: #0b6e4f;
        --danger: #a12d2f;
        --line: #d8c9af;
        --shadow: 0 12px 30px rgba(63, 44, 15, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(209, 123, 15, 0.18), transparent 34%),
          radial-gradient(circle at top right, rgba(11, 110, 79, 0.12), transparent 30%),
          linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
      }

      .card {
        background: rgba(255, 250, 241, 0.97);
        border: 1px solid rgba(216, 201, 175, 0.9);
        border-radius: 24px;
        padding: 40px 44px;
        box-shadow: var(--shadow);
        width: min(420px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 4px;
        font-size: 1.9rem;
        line-height: 1.05;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.92rem;
        margin: 0 0 28px;
      }

      label {
        display: block;
        font-size: 0.92rem;
        font-weight: 700;
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: white;
        margin-bottom: 16px;
        transition: outline 0.1s;
      }

      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      button {
        width: 100%;
        font: inherit;
        border: 0;
        border-radius: 999px;
        padding: 11px 14px;
        cursor: pointer;
        color: white;
        background: var(--accent);
        margin-top: 4px;
      }

      button:hover { opacity: 0.9; }

      .flash {
        border-radius: 12px;
        padding: 10px 14px;
        border: 1px solid rgba(161, 45, 47, 0.3);
        border-left: 4px solid var(--danger);
        background: #fffdf8;
        font-size: 0.92rem;
        margin-bottom: 20px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HOA Clause Admin</h1>
      <p class="subtitle">Sign in to continue</p>

      {% with flashes = get_flashed_messages(with_categories=true) %}
        {% for category, message in flashes %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login_post') }}">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text"
                 autocomplete="username" required autofocus>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </body>
</html>
