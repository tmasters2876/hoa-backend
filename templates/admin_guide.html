{% extends "admin_base.html" %}

{% block topbar %}
<div class="topbar">
  <span class="topbar-title">Committee Member Guide</span>
  <span class="topbar-sub">how to review, flag, and propose changes</span>
  <div class="topbar-spacer"></div>
  <a href="{{ url_for('admin_home') }}" style="font-size:12px;font-weight:500;">← Back to Clauses</a>
</div>
{% endblock %}

{% block content %}
<style>
  .guide-md { max-width: 860px; font-size: 14px; line-height: 1.65; }
  .guide-md h1 { font-size: 22px; margin: 0 0 6px; }
  .guide-md h2 { font-size: 17px; margin: 26px 0 8px; padding-top: 14px; border-top: 1px solid var(--border); }
  .guide-md h3 { font-size: 14.5px; margin: 18px 0 6px; }
  .guide-md p, .guide-md li { color: var(--text); }
  .guide-md ul, .guide-md ol { padding-left: 22px; margin: 8px 0; }
  .guide-md li { margin: 4px 0; }
  .guide-md hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .guide-md code {
    font-family: ui-monospace, "Cascadia Code", "Fira Mono", monospace;
    font-size: 12.5px; background: var(--surface-2);
    padding: 1px 5px; border-radius: 4px;
  }
  .guide-md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .guide-md th, .guide-md td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .guide-md th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .guide-md blockquote { border-left: 3px solid var(--accent); margin: 10px 0; padding: 2px 14px; color: var(--muted); }
  .guide-md .mermaid { display: flex; justify-content: center; margin: 18px 0; }
</style>

<div class="panel guide-md">
  {{ body | safe }}
</div>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: "neutral", securityLevel: "loose" });
</script>
{% endblock %}
